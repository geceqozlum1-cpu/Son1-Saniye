name: V27 Android WebView Diagnostic (non-release)
on:
  push:
    branches: [vol27-webview-diagnostics]
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Emulator logging
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.sonbirsaniye.son1saniye.v26/com.sonbirsaniye.arcade.MainActivity
            sleep 7
            adb logcat -d -s SON1_JS:E SON1_DOM:I chromium:E AndroidRuntime:E > webview_log.txt
            adb shell screencap -p /sdcard/probe.png
            adb pull /sdcard/probe.png ./probe.png
            cat webview_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V27_ANDROID_WEBVIEW_ERROR_DIAG
          path: |
            ./probe.png
            ./webview_log.txt
          if-no-files-found: warn

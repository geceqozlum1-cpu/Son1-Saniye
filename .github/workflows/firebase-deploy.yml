name: Deploy Firebase Leagues
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Firebase project variables
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CONFIG_JSON: ${{ vars.FIREBASE_WEB_CONFIG_JSON }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$FIREBASE_WEB_CONFIG_JSON" || { echo "Missing FIREBASE_WEB_CONFIG_JSON"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$DEPLOY_SA" || { echo "Missing GCP_DEPLOY_SERVICE_ACCOUNT"; exit 1; }
          python3 scripts/inject_firebase_config.py app/src/main/assets/index.html firebase/public/index.html
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Test league scoring
        run: node --test firebase/functions/league-core.test.js
      - name: Install Firebase CLI and functions packages
        run: |
          npm install -g firebase-tools
          npm install --prefix firebase/functions --omit=dev
      - name: Deploy Hosting, Functions, Firestore rules
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: firebase deploy --config firebase/firebase.json --project "$FIREBASE_PROJECT_ID" --only firestore:rules,functions,hosting --non-interactive

name: V27 Standalone Gradle APK and Android Emulator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v27-build-android.yml'
      - 'app/**'
      - '*.gradle.kts'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build without repackaging or editing the HTML asset
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate standard Android debug APK
        run: |
          set -eux
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
          sha256sum app/src/main/assets/index.html
          sha256sum "$APK"
      - name: Install and open APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.sonbirsaniye.son1saniye.v26/com.sonbirsaniye.arcade.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -F com.sonbirsaniye.son1saniye.v26
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SON_1_SANIYE_V27_EMULATOR_KURULUM_TESTLI_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: V14 Cosmic Android Repair Build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/v14-repair.yml'
  workflow_dispatch:
jobs:
  android-v14:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build with Android Gradle Plugin
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify install package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SON_1_SANIYE_V14_KURULUM_ONARILMIS_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

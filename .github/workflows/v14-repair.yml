name: V25 Verified Android Package
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/v14-repair.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK without modifying the ZIP afterwards
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug
      - name: Verify Android signatures, alignment, resources, and game assets
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-signature.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.sonbirsaniye.son1saniye.v25'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.sonbirsaniye.arcade.MainActivity'" /tmp/badging.txt
          unzip -t "$APK"
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_STORED
          import hashlib
          f="app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(f) as z:
              resource=z.getinfo("resources.arsc")
              assert resource.compress_type == ZIP_STORED, "resources.arsc unexpectedly compressed"
              content=z.read("assets/index.html")
              assert hashlib.sha256(content).hexdigest() == "dc394ea10434a25c8736201df41015d7f89faa14a67bab7220a7dd1d82966163", "Source/packaged HTML mismatch"
              assert len(content) > 1000000
              assert any(x.startswith("res/") for x in z.namelist()), "APK has no compiled Android resources"
              print("SHA-256 HTML:", hashlib.sha256(content).hexdigest())
              print("Android resources and launcher artwork verified")
          PY
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SON_1_SANIYE_V25_STANDART_IMZALI_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SON_1_SANIYE_V25_STANDART_IMZALI_APK
          path: ./verified-apk
      - name: Allow KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: |
            set -eux
            adb install -r verified-apk/app-debug.apk
            adb shell am start -W -n com.sonbirsaniye.son1saniye.v25/com.sonbirsaniye.arcade.MainActivity
            sleep 8
            adb shell pidof com.sonbirsaniye.son1saniye.v25
            adb shell dumpsys activity activities | grep -F 'com.sonbirsaniye.son1saniye.v25'
            test -z "$(adb logcat -d -s AndroidRuntime:E | grep -A 8 -F 'FATAL EXCEPTION' | grep -F 'com.sonbirsaniye.son1saniye.v25' || true)"
            adb shell screencap -p /sdcard/v25-start.png
            adb pull /sdcard/v25-start.png ./v25-start.png
            echo 'Emulator APK install and launch passed'
      - name: Upload emulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SON_1_SANIYE_V25_ANDROID_EMULATOR_SCREENSHOT
          path: ./v25-start.png
          if-no-files-found: ignore
